services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeroscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroscan}
      POSTGRES_DB: ${POSTGRES_DB:-aeroscan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroscan} -d ${POSTGRES_DB:-aeroscan}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
